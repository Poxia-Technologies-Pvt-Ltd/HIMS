# Surgimax Hospital HMIS: reverse tunnel from the hospital PC, nothing else.
Match User surgimaxtunnel
    AllowTcpForwarding remote
    PermitListen 127.0.0.1:7060
    GatewayPorts no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PasswordAuthentication no
    ClientAliveInterval 30
    ClientAliveCountMax 3
