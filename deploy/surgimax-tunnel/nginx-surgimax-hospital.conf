# surgimax-hospital.dvaic.com - Surgimax Hospital HMIS (PC at the hospital), reached through a reverse SSH tunnel on 127.0.0.1:7060
server {
    server_name surgimax-hospital.dvaic.com;
    client_max_body_size 50m;
    location / {
        proxy_pass http://127.0.0.1:7060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 504 = @offline;
    }
    location @offline {
        default_type text/html;
        return 503 '<h2 style="font-family:sans-serif">Surgimax Hospital system is offline</h2><p style="font-family:sans-serif">The hospital server is not connected right now. Please try again shortly.</p>';
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/surgimax-hospital.dvaic.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/surgimax-hospital.dvaic.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = surgimax-hospital.dvaic.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name surgimax-hospital.dvaic.com;
    listen 80;
    return 404; # managed by Certbot


}